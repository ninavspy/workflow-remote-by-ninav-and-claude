name: Build APK

on:
  workflow_dispatch:
    inputs:
      webview_url:
        description: 'URL que o app vai abrir (ex: https://minhaempresa.com)'
        required: true
        default: 'https://ninav.vercel.app'
      app_name:
        description: 'Nome do app (aparece no celular)'
        required: true
        default: 'NinaV'
      icon_base64:
        description: 'Ícone do app em base64 (PNG 512x512, opcional)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configura JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configura Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Substitui URL no build.gradle.kts
        env:
          WEBVIEW_URL: ${{ github.event.inputs.webview_url }}
        run: |
          python3 - <<'EOF'
          import os, re
          url = os.environ['WEBVIEW_URL']
          path = 'app/build.gradle.kts'
          content = open(path).read()
          content = re.sub(
            r'buildConfigField\("String",\s*"WEBVIEW_URL",\s*"[^"]*"\)',
            f'buildConfigField("String", "WEBVIEW_URL", \\"{url}\\")',
            content
          )
          open(path, 'w').write(content)
          print(f"URL definida: {url}")
          EOF

      - name: Substitui nome do app no strings.xml
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
        run: |
          python3 - <<'EOF'
          import os, re
          name = os.environ['APP_NAME']
          path = 'app/src/main/res/values/strings.xml'
          content = open(path).read()
          content = re.sub(
            r'<string name="app_name">[^<]*</string>',
            f'<string name="app_name">{name}</string>',
            content
          )
          open(path, 'w').write(content)
          print(f"Nome definido: {name}")
          EOF

      - name: Aplica ícone customizado (se enviado)
        if: ${{ github.event.inputs.icon_base64 != '' }}
        env:
          ICON_B64: ${{ github.event.inputs.icon_base64 }}
        run: |
          python3 - <<'EOF'
          import os, base64, subprocess

          icon_b64 = os.environ['ICON_B64']
          icon_bytes = base64.b64decode(icon_b64)

          # Salva o PNG original 512x512
          with open('/tmp/icon_original.png', 'wb') as f:
              f.write(icon_bytes)

          # Instala imagemagick para redimensionar
          subprocess.run(['sudo', 'apt-get', 'install', '-y', '-q', 'imagemagick'], check=True)

          # Gera cada densidade
          sizes = {
              'mipmap-mdpi':    48,
              'mipmap-hdpi':    72,
              'mipmap-xhdpi':   96,
              'mipmap-xxhdpi':  144,
              'mipmap-xxxhdpi': 192,
          }

          for folder, size in sizes.items():
              path = f'app/src/main/res/{folder}'
              os.makedirs(path, exist_ok=True)
              for name in ['ic_launcher.png', 'ic_launcher_round.png']:
                  out = f'{path}/{name}'
                  subprocess.run([
                      'convert', '/tmp/icon_original.png',
                      '-resize', f'{size}x{size}',
                      out
                  ], check=True)
                  print(f"Gerado: {out}")

          print("Ícones aplicados com sucesso!")
          EOF

      - name: Permissão de execução no gradlew
        run: chmod +x gradlew

      - name: Build APK debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Renomeia APK com timestamp
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          SAFE_NAME=$(echo "${{ github.event.inputs.app_name }}" | tr ' ' '_' | tr '[:upper:]' '[:lower:]')
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/${SAFE_NAME}_${TIMESTAMP}.apk
          echo "APK_NAME=${SAFE_NAME}_${TIMESTAMP}.apk" >> $GITHUB_ENV

      - name: Upload APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: app/build/outputs/apk/debug/${{ env.APK_NAME }}
          retention-days: 7
