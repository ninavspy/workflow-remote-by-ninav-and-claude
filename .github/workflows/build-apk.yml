name: Build APK

on:
  workflow_dispatch:
    inputs:
      webview_url:
        description: 'URL que o app vai abrir (ex: https://minhaempresa.com)'
        required: true
        default: 'https://ninav.vercel.app'
      app_name:
        description: 'Nome do app (aparece no celular)'
        required: true
        default: 'NinaV'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configura JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configura Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Substitui URL no build.gradle.kts
        run: |
          sed -i 's|buildConfigField("String", "WEBVIEW_URL", ".*")|buildConfigField("String", "WEBVIEW_URL", "\"${{ github.event.inputs.webview_url }}\"")|' app/build.gradle.kts

      - name: Substitui nome do app no strings.xml
        run: |
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">${{ github.event.inputs.app_name }}</string>|' app/src/main/res/values/strings.xml

      - name: Permissão de execução no gradlew
        run: chmod +x gradlew

      - name: Build APK debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Renomeia APK com timestamp
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          SAFE_NAME=$(echo "${{ github.event.inputs.app_name }}" | tr ' ' '_' | tr '[:upper:]' '[:lower:]')
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/${SAFE_NAME}_${TIMESTAMP}.apk
          echo "APK_NAME=${SAFE_NAME}_${TIMESTAMP}.apk" >> $GITHUB_ENV

      - name: Upload APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: app/build/outputs/apk/debug/${{ env.APK_NAME }}
          retention-days: 7
